name: Release

# Publishes @damorris25/content-extractor to npm via trusted publishing (OIDC).
# No tokens required — npmjs.com must have this repo + workflow configured as
# a trusted publisher for the package.
#
# To release: bump "version" in ts/package.json, commit, then:
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Install
        run: npm ci
      # prepublishOnly runs clean + build + test + typecheck
      - name: Publish
        run: npm publish --access public
